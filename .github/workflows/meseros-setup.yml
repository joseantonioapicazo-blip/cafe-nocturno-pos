name: meseros-setup

on:
  push:
    paths:
      - '.github/workflows/meseros-setup.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ajustar app.js y traer libreria QR
        run: |
          python3 - <<'PY'
          path = 'js/app.js'
          src = open(path, encoding='utf-8').read()

          a_old = "  /* ---------------- init ---------------- */\n\n  applySettings();"
          a_new = """  /* ---------------- puente para meseros (LAN) ---------------- */

          window.POSBridge = {
            addItems: function (items) {
              var added = 0;
              (items || []).forEach(function (it) {
                var p = productById(it.pid);
                if (!p) return;
                addToCart(p, {
                  size: it.size || 'M',
                  milk: it.milk || 'leche',
                  extras: Array.isArray(it.extras) ? it.extras : [],
                  qty: Math.max(1, Number(it.qty) || 1)
                });
                added += 1;
              });
              renderCart();
              return added;
            },
            goTo: function (v) { setView(v); },
            toast: toast,
            money: money,
            checkout: function () { if (typeof openCheckout === 'function') openCheckout(); }
          };

          """ + a_old

          b_old = "    state.sales.unshift(sale);\n    state.folio = state.folio + 1;"
          b_new = """    state.sales.unshift(sale);
              if (window.POSWaiterSync && window.POSWaiterSync.onSale) {
                try { window.POSWaiterSync.onSale(sale); } catch (e) { /* sin conexion de meseros */ }
              }
              state.folio = state.folio + 1;"""

          assert src.count(a_old) == 1, 'ancla init no encontrada'
          assert src.count(b_old) == 1, 'ancla venta no encontrada'
          src = src.replace(a_old, a_new, 1).replace(b_old, b_new, 1)
          open(path, 'w', encoding='utf-8').write(src)
          print('app.js parcheado')
          PY
          mkdir -p js/vendor
          curl -fsSL -o js/vendor/qrcode.min.js https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js
          wc -c js/app.js js/vendor/qrcode.min.js

      - name: Publicar cambios
        run: |
          git config user.name "Cafe Nocturno"
          git config user.email "noreply@users.noreply.github.com"
          git add js/app.js js/vendor/qrcode.min.js
          git commit -m "feat(meseros): puente de la caja y libreria QR local" || true
          git push

      - name: Quitar el flujo temporal
        run: |
          git rm -q .github/workflows/meseros-setup.yml
          git commit -m "chore: retirar flujo temporal de configuracion"
          git push
