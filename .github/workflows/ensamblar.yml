name: correccion final
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  corregir:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Corregir y limpiar
        run: |
          sed -i 's/¿Eliminar este bebida?/¿Eliminar esta bebida?/' js/app.js
          rm -f .github/workflows/ensamblar.yml
          git config user.name "cafe-nocturno-bot"
          git config user.email "cafe-nocturno-bot@users.noreply.github.com"
          git add -A
          git commit -m "Corrige concordancia del mensaje al eliminar una bebida" || exit 0
          git push
