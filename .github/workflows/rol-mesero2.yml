name: rol-mesero2

on:
  push:
    paths:
      - '.github/workflows/rol-mesero2.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Ejecutar con diagnostico
        run: |
          exec > diag.txt 2>&1
          echo "pwd: $(pwd)"
          echo "python: $(python3 --version 2>&1)"
          ls -la tools
          python3 -c "print('python responde')"
          set +e
          python3 tools/rol-mesero.py
          echo "rc=$?"
          echo "hash: $(git hash-object js/app.js)"

      - name: Subir cambios y diagnostico
        run: |
          git config user.name "Antonio Picazo"
          git config user.email "joseantonioapicazo@gmail.com"
          git add -A js/app.js diag.txt
          git commit -m "feat: agregar el rol Mesero a usuarios y permisos" || true
          git push
