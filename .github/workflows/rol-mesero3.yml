name: rol-mesero3

on:
  push:
    paths:
      - '.github/workflows/rol-mesero3.yml'

permissions:
  contents: write

jobs:
  aplicar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Aplicar el rol mesero y verificar
        run: |
          python3 tools/rol-mesero.py
          H=$(git hash-object js/app.js)
          echo "hash obtenido: $H"
          test "$H" = "ba81945ad99629cda3a29292965380af8ff339eb"
          echo "verificado"

      - name: Commit y limpieza de archivos temporales
        run: |
          git config user.name "Antonio Picazo"
          git config user.email "joseantonioapicazo@gmail.com"
          rm -rf tools
          rm -f diag.txt
          rm -f .github/workflows/rol-mesero.yml
          rm -f .github/workflows/rol-mesero2.yml
          rm -f .github/workflows/rol-mesero3.yml
          git add -A
          git commit -m "feat: agregar el rol Mesero a usuarios y permisos"
          git push
