name: fix-app

on:
  push:
    paths:
      - '.github/workflows/fix-app.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Normalizar app.js
        run: python3 tools/fix-app.py
      - name: Publicar
        run: |
          git config user.name "Cafe Nocturno"
          git config user.email "noreply@users.noreply.github.com"
          rm -f tools/fix-app.py
          rmdir tools 2>/dev/null || true
          git add -A
          git commit -m "fix(meseros): alinear app.js con la version local" || true
          git push
      - name: Retirar flujo temporal
        run: |
          git rm -q .github/workflows/fix-app.yml
          git commit -m "chore: retirar flujo temporal de normalizacion"
          git push
